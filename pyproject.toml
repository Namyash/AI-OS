[project]
name = "private-ai-os"
version = "0.0.1"
description = "Privacy-first, AI-native operating environment (Debian-based)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Added when the corresponding milestone starts, not before (see DEVELOPMENT_STATUS.md).
api = ["fastapi>=0.115", "uvicorn>=0.30"]
# The backend tests import the service, so a dev install must include the api extra (one install command).
dev = ["private-ai-os[api]", "pytest>=8", "ruff>=0.5", "pyyaml>=6", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["backend*", "model_runtime*", "document_engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]
addopts = "--import-mode=importlib -ra -m 'not e2e'"
markers = [
    "e2e: boots the built ISO under QEMU in a container; slow, needs Docker and dist/*.iso (run with -m e2e)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]
