# Private AI OS: name resolution is unicast DNS only, and nothing listens beyond loopback for it.
#
# LLMNR and multicast DNS make systemd-resolved answer the local network on every address (TCP and UDP 5355, UDP 5353),
# which is name-spoofing surface this machine has no use for. The per-link LLMNR=no / MulticastDNS=no in
# 20-wired.network does not close the global listeners; only these global settings do. The boot self-check
# (no-external-listeners, docs/development/BOOT_TESTING.md) fails while they are open, and
# tests/security/test_os_hardening.py keeps these two values from being weakened.
[Resolve]
LLMNR=no
MulticastDNS=no
