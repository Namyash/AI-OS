# Private AI OS service accounts (systemd-sysusers). System accounts: no login shell, no password.
#
# pai            the backend (pai-backend.service). Its primary group "pai" owns /run/pai and the token file.
# pai-llm        the model runtime (a later phase); PHASE1_PLAN M1.3 lists it. No unit uses it yet and it joins no group.
# pai-ui         the kiosk shell (milestone M1.4); no unit uses it yet.
# pai-selfcheck  the boot security self-check (pai-selfcheck.service, only started when the kernel command line has
#                pai.selfcheck=1). An account of its own, not "nobody": a shared account shares a uid with others.
#
# The accounts are defined now so their UIDs are fixed in the image (the build hook runs systemd-sysusers on this file):
# files that persist on the encrypted data volume then keep the same owner across boots.
#
# Token access: the backend writes /run/pai/token as 0640 pai:pai. Adding a member to group pai lets that account read
# it but not change it: the kiosk (pai-ui) to authenticate, the self-check (pai-selfcheck) to prove the API refuses a
# request without it and accepts one with it. /run/pai (0750) holds nothing else, and /var/lib/pai is 0700, so the
# group cannot list or enter the data directory.
#
# Type  Name           ID  GECOS                                Home             Shell
u       pai            -   "Private AI OS backend"              /var/lib/pai     /usr/sbin/nologin
u       pai-llm        -   "Private AI OS model runtime"        -                /usr/sbin/nologin
u       pai-ui         -   "Private AI OS kiosk shell"          -                /usr/sbin/nologin
u       pai-selfcheck  -   "Private AI OS boot self-check"      -                /usr/sbin/nologin
m       pai-ui         pai
m       pai-selfcheck  pai
