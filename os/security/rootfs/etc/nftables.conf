#!/usr/sbin/nft -f
# Private AI OS baseline firewall: default-deny in every direction.
#
# The machine is offline until the user enables network access in Settings. The network-policy service
# (later milestone) then fills allow_v4/allow_v6 at run time. Until per-service-user rules exist
# (nft `meta skuid`), allowed destinations apply to every local user.
flush ruleset

table inet pai_filter {
    set allow_v4 {
        type ipv4_addr
        flags interval
    }
    set allow_v6 {
        type ipv6_addr
        flags interval
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept
        udp sport 67 udp dport 68 accept        # DHCPv4 replies (address assignment only)
        udp sport 547 udp dport 546 accept      # DHCPv6 replies
        icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;
        ct state invalid drop
        ct state established,related accept
        oifname "lo" accept
        udp sport 68 udp dport 67 accept        # DHCPv4 requests
        udp sport 546 udp dport 547 accept      # DHCPv6 requests
        icmpv6 type { nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert } accept
        ip daddr @allow_v4 accept
        ip6 daddr @allow_v6 accept
    }
}
