# No login prompt appears on other virtual terminals. The kiosk owns tty1 (pai-kiosk.service names its tty explicitly);
# without this, switching to tty2 to tty6 starts a getty, and the live image's autologin would hand out a shell there.
# Administrative access is meant to be an explicit, authorised function, never a default console.
[Login]
NAutoVTs=0
ReserveVT=0
